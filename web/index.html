<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- 安装元信息在构建期由 pwa-build.mjs 从 zh.json 生成，这里只留占位符。 -->
    <meta name="description" content="%PWA_DESCRIPTION%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%PWA_SHORT_NAME%" />
    <!-- 明暗两枚主题色与应用背景一致：iOS 独立窗口顶部安全区与安卓状态栏都用它。 -->
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <title>%APP_TITLE%</title>
    <script>
      // 在样式表生效前先落到实际明暗与强调色，避免首帧闪一下默认外观。
      // 两者都是账号偏好，bootstrap 落定后会用服务端的值再覆盖一次。
      //
      // 明暗：显式 light / dark 优先；auto（或没有缓存）时先问原生壳的同步接口——
      // Android WebView 里 prefers-color-scheme 不可靠，系统深色只能由原生读出来。
      // 没有壳（浏览器 / PWA）或旧壳没有这个方法时退回 matchMedia。
      // 两种来源都写 <html data-mode>：令牌只认它，页面不再依赖 media query。
      (function () {
        var mode = '';
        try {
          mode = localStorage.getItem('calmobile.mode') || '';
        } catch (ignored) {
          // 隐私模式下读不到缓存：按跟随系统处理
        }
        if (mode !== 'dark' && mode !== 'light') {
          var systemDark = null;
          try {
            var native = window.CalMobileNative;
            if (native && typeof native.systemAppearance === 'function') {
              var appearance = JSON.parse(native.systemAppearance());
              if (appearance) {
                // 本机缓存被清掉时，原生镜像里的显式偏好仍然比「系统」更接近账号设置。
                if (appearance.mode === 'dark' || appearance.mode === 'light') {
                  mode = appearance.mode;
                }
                if (typeof appearance.systemDark === 'boolean') {
                  systemDark = appearance.systemDark;
                }
              }
            }
          } catch (ignoredBridge) {
            // 桥调用失败不能挡住首帧：退回 matchMedia（浏览器语义）
          }
          if (mode !== 'dark' && mode !== 'light') {
            if (systemDark === null) {
              systemDark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            }
            mode = systemDark ? 'dark' : 'light';
          }
        }
        document.documentElement.dataset.mode = mode;
        try {
          var accent = localStorage.getItem('calmobile.accent');
          if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
            document.documentElement.style.setProperty('--accent', accent);
          }
        } catch (ignoredAccent) {
          // 隐私模式下忽略缓存读取失败，用 tokens.css 的首帧回退色
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 第三方依赖经 pnpm 管理，由使用它的页面按需加载本地构建资源。 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
