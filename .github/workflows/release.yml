# master 上的 CI 成功后才运行。功能分支、拉取请求和普通提交不发布。
# 只有合并提交才按路径自动发布。浅克隆里 rev-list 看不到父提交，用提交对象的 parent 行判断。
# Actions 里手动运行是强制发布：不看路径，构建当时的 master。四个开关默认都开。
# 发 APK 时总会发布运行时包：APK 里的页面与服务器 /app/ 页面的版本号必须一致。
# 这个提交还没有成功的 master CI 时，强制发布拒绝执行。
# versionCode / versionName 用本工作流的运行编号，npm 运行时包用同一个 0.1.<编号>。
# 删掉或换掉这个文件会让编号从 1 重新计。
# 运行时包发布到公开 npm 的 calmobile-server；服务器由 calmobile-update.timer 每 5 分钟拉取。

name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      apk:
        description: 发布 APK。打开时会同时发布运行时包。
        type: boolean
        default: true
      server:
        description: 发布运行时包（服务端改动）。包内总是包含服务端和两份页面。
        type: boolean
        default: true
      app:
        description: 发布运行时包（应用页面改动）
        type: boolean
        default: true
      join:
        description: 发布运行时包（报名站改动）
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  scope:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apk: ${{ steps.decide.outputs.apk }}
      server: ${{ steps.decide.outputs.server }}
      app: ${{ steps.decide.outputs.app }}
      join: ${{ steps.decide.outputs.join }}
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: 确认可以发布
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_REF" != "refs/heads/master" ]; then
              echo "只能在 master 上强制发布。" >&2
              exit 1
            fi
            gh run list --commit "$sha" --workflow CI --limit 20 --json conclusion,status,event,headBranch > "$RUNNER_TEMP/ci-runs.json"
            node scripts/release-scope.mjs --ci-ok "$RUNNER_TEMP/ci-runs.json"
            echo "mode=force" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -p HEAD > "$RUNNER_TEMP/commit.txt"
          kind=$(node scripts/release-scope.mjs --merge-commit "$RUNNER_TEMP/commit.txt")
          if [ "$kind" = "merge" ]; then
            echo "mode=merge" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "不是合并提交，跳过发布。"
          fi

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.mode == 'merge'
        with:
          name: changed-files
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: 判断发布范围
        id: decide
        env:
          FORCE_APK: ${{ inputs.apk }}
          FORCE_SERVER: ${{ inputs.server }}
          FORCE_APP: ${{ inputs.app }}
          FORCE_JOIN: ${{ inputs.join }}
        run: |
          set -euo pipefail
          mode="${{ steps.gate.outputs.mode }}"
          if [ "$mode" = "skip" ]; then
            printf '%s\n' "apk=false" "server=false" "app=false" "join=false" "publish=false" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$mode" = "force" ]; then
            node scripts/release-scope.mjs --force \
              "apk=${FORCE_APK}" \
              "server=${FORCE_SERVER}" \
              "app=${FORCE_APP}" \
              "join=${FORCE_JOIN}" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/release-scope.mjs changed-files.txt | tee -a "$GITHUB_OUTPUT"

  release-apk:
    needs: scope
    if: needs.scope.outputs.apk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: 写入签名文件
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "缺少 GitHub Secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/calmobile-release.jks"
          chmod 600 "$RUNNER_TEMP/calmobile-release.jks"

      - name: 构建正式包
        env:
          ANDROID_APPLICATION_ID: com.blathroat.calmobile
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}
          APP_API_BASE: ${{ vars.APP_API_BASE }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/calmobile-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node --input-type=module <<'EOF'
          import { resolveClientTarget } from './scripts/client-target.mjs';

          const target = resolveClientTarget({
            APP_API_BASE: process.env.APP_API_BASE,
            ANDROID_APPLICATION_ID: process.env.ANDROID_APPLICATION_ID,
            ANDROID_VERSION_CODE: process.env.ANDROID_VERSION_CODE,
            ANDROID_VERSION_NAME: process.env.ANDROID_VERSION_NAME,
          });
          if (target.allowCleartext || target.loopbackPort != null) {
            process.stderr.write(`正式包的 APP_API_BASE 必须是公网 https，当前是 ${target.apiBase}\n`);
            process.exit(1);
          }
          if (target.applicationId !== 'com.blathroat.calmobile') {
            process.stderr.write(`包名必须是 com.blathroat.calmobile，当前是 ${target.applicationId}\n`);
            process.exit(1);
          }
          const pub = String(process.env.PUBLIC_BASE_URL ?? '').trim().replace(/\/+$/, '');
          let origin = '';
          try {
            const url = new URL(pub);
            const path = url.pathname.replace(/\/+$/, '') || '/';
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || path !== '/') {
              throw new Error('bad');
            }
            origin = url.origin;
          } catch {
            process.stderr.write('PUBLIC_BASE_URL 必须是不带路径的 https 源\n');
            process.exit(1);
          }
          if (target.mediaOrigin !== origin) {
            process.stderr.write(`APP_API_BASE 与 PUBLIC_BASE_URL 不是同一个源：${target.mediaOrigin} / ${origin}\n`);
            process.exit(1);
          }
          EOF
          ./gradlew :app:assembleRelease --no-daemon

      - name: 删除签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/calmobile-release.jks"

      - name: 发布 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          tag="v${version}"
          asset="calmobile-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          sha="${{ needs.scope.outputs.sha }}"
          notes=$(printf '%s\n' "包名 com.blathroat.calmobile" "提交 ${sha}")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --title "calMobile ${version}" --notes "$notes" --target "$sha"
          fi

  publish-runtime:
    needs: scope
    if: needs.scope.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.scope.outputs.sha }}

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile

      - name: 校验 APP_API_BASE
        env:
          APP_API_BASE: ${{ vars.APP_API_BASE }}
        run: |
          node --input-type=module <<'EOF'
          import { resolveClientTarget } from './scripts/client-target.mjs';

          const target = resolveClientTarget({ APP_API_BASE: process.env.APP_API_BASE });
          if (target.allowCleartext || target.loopbackPort != null) {
            process.stderr.write(`运行时包里的页面必须指向公网 https，当前是 ${target.apiBase}\n`);
            process.exit(1);
          }
          EOF

      - name: 构建服务端与两份页面
        env:
          APP_API_BASE: ${{ vars.APP_API_BASE }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          pnpm --dir server build
          pnpm --dir web build

      - name: 暂存运行时包
        run: |
          node scripts/runtime-bundle.mjs \
            --version "0.1.${GITHUB_RUN_NUMBER}" \
            --out "$RUNNER_TEMP/calmobile-runtime"

      - name: 检查运行时包内容
        run: node scripts/runtime-bundle.mjs --check "$RUNNER_TEMP/calmobile-runtime"

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "缺少 GitHub Secret NPM_TOKEN" >&2
            exit 1
          fi
          version="0.1.${GITHUB_RUN_NUMBER}"
          if npm view "calmobile-server@${version}" version >/dev/null 2>&1; then
            echo "calmobile-server@${version} 已经发布过，跳过。"
            exit 0
          fi
          npm publish "$RUNNER_TEMP/calmobile-runtime" --access public --provenance --tag latest
