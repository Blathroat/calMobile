name: CI

on:
  push:
    branches: [master, refactor/vue-ts]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            server/pnpm-lock.yaml
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile
      - run: node scripts/smoke-check.js
      - run: node scripts/webui-check.js
      - run: node --test scripts/webui-render.test.js
      - run: node scripts/check-strings.js
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir server typecheck
      - run: pnpm --dir server test
      - run: pnpm --dir server test:contract

  android:
    runs-on: ubuntu-latest
    needs: web-and-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
