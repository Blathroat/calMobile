name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: Asia/Shanghai
          PGTZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile

      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web fmt:check
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir server lint
      - run: pnpm --dir server fmt:check
      - run: pnpm --dir server typecheck
      - run: pnpm --dir server test
      - run: pnpm --dir server test:contract

  android:
    runs-on: ubuntu-latest
    needs: web-and-server
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: pnpm --dir web install --frozen-lockfile

      - run: pnpm --dir web build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
