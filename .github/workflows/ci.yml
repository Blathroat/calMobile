name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: Asia/Shanghai
          PGTZ: Asia/Shanghai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir server install --frozen-lockfile

      - run: pnpm --dir web typecheck
      - run: pnpm --dir web lint
      - run: pnpm --dir web fmt:check
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: pnpm --dir server lint
      - run: pnpm --dir server fmt:check
      - run: pnpm --dir server typecheck
      - run: pnpm --dir server test
      - run: pnpm --dir server test:contract

      - name: 记录这次推送改了哪些文件
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            git ls-files > changed-files.txt
          elif git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git diff --name-only --find-renames "$before" "$after" > changed-files.txt
          else
            echo "找不到推送前的提交，无法判断发布范围" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          name: changed-files
          path: changed-files.txt
          retention-days: 5
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    needs: web-and-server
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - run: pnpm --dir web install --frozen-lockfile

      - run: pnpm --dir web build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
