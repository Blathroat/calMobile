org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# android.enableJetifier 已随 AGP 9.0 移除（Jetifier 被删除），本项目也没有 AndroidX 依赖，不需要它
android.useAndroidX=true
android.nonTransitiveRClass=true

# HTTP timeout settings
systemProp.http.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.https.connectionTimeout=120000

# TLS settings
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.jdk.tls.client.protocols=TLSv1.2,TLSv1.3
