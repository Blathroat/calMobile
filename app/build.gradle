plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.calmobile'
    compileSdk = 36.1

    defaultConfig {
        applicationId = 'com.example.calmobile'
        minSdk = 24
        targetSdk = 36.1
        versionCode = 1
        versionName = '0.1.0'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}

// Vue 前端独立构建到 web/dist；迁移完成前不覆盖现有 assets/web。
def webDir = file("../web")
def pnpmCommand = System.getProperty("os.name").toLowerCase().contains("windows") ? "pnpm.cmd" : "pnpm"
tasks.register("buildWeb", Exec) {
    workingDir webDir
    commandLine pnpmCommand, "build"
}

tasks.register("typecheckWeb", Exec) {
    workingDir webDir
    commandLine pnpmCommand, "typecheck"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Gson：WebAppBridge 的 JSON 编解码，前端与原生之间唯一的序列化依赖。
    implementation 'com.google.code.gson:gson:2.14.0'

    // 测试
    testImplementation 'junit:junit:4.13.2'
}
