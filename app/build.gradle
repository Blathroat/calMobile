plugins {
    id 'com.android.application'
}

// 与 Vite 读同一份构建目标：进程环境变量优先于 server/.env。
def clientTargetJson = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'node', 'scripts/client-target.mjs'
}.standardOutput.asText.get().trim()
def clientTarget = new groovy.json.JsonSlurper().parseText(clientTargetJson)

android {
    namespace = 'com.example.calmobile'
    compileSdk = 36.1

    defaultConfig {
        applicationId = clientTarget.applicationId
        minSdk = 24
        targetSdk = 36.1
        versionCode = clientTarget.versionCode as int
        versionName = clientTarget.versionName
        manifestPlaceholders = [allowCleartext: clientTarget.allowCleartext ? 'true' : 'false']
        buildConfigField 'boolean', 'ALLOW_CLEARTEXT', clientTarget.allowCleartext ? 'true' : 'false'
    }

    buildFeatures {
        buildConfig = true
    }

    def keystorePath = String.valueOf(clientTarget.signing.storeFile ?: '')
    if (keystorePath) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystorePath)
                storePassword String.valueOf(clientTarget.signing.storePassword ?: '')
                keyAlias String.valueOf(clientTarget.signing.keyAlias ?: '')
                keyPassword String.valueOf(clientTarget.signing.keyPassword ?: '')
            }
        }
    }

    buildTypes {
        release {
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }
}

android.sourceSets.main.assets.srcDir("${buildDir}/generated/vue-web")

// Vue 前端构建到 generated assets，不修改源码目录。
def webDir = file("../web")
def pnpmCommand = System.getProperty("os.name").toLowerCase().contains("windows") ? "pnpm.cmd" : "pnpm"
tasks.register("buildWeb", Exec) {
    workingDir webDir
    environment 'APP_API_BASE', clientTarget.apiBase
    commandLine pnpmCommand, "build"
}

tasks.register("typecheckWeb", Exec) {
    workingDir webDir
    commandLine pnpmCommand, "typecheck"
}

tasks.register("syncWebAssets", Sync) {
    dependsOn "buildWeb"
    from("${webDir}/dist")
    into("${buildDir}/generated/vue-web/web")
}

tasks.named("preBuild").configure { dependsOn("syncWebAssets") }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencies {
    // Gson：WebAppBridge 的 JSON 编解码，前端与原生之间唯一的序列化依赖。
    implementation 'com.google.code.gson:gson:2.14.0'

    // 测试
    testImplementation 'junit:junit:4.13.2'
}

// 放在 android 块之后：配置还没写完就抛错，AGP 会另报一条「没有 compileSdk」。
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
if (releaseRequested) {
    def problems = []
    if (clientTarget.allowCleartext || clientTarget.loopbackPort != null) {
        problems << "正式包的 APP_API_BASE 必须是公网 https，当前是 ${clientTarget.apiBase}"
    }
    def applicationId = String.valueOf(clientTarget.applicationId)
    if (applicationId == 'com.example' || applicationId.startsWith('com.example.')) {
        problems << '正式包不能使用 com.example 包名，请设置 ANDROID_APPLICATION_ID'
    }
    def store = String.valueOf(clientTarget.signing.storeFile ?: '')
    def storePassword = String.valueOf(clientTarget.signing.storePassword ?: '')
    def keyAlias = String.valueOf(clientTarget.signing.keyAlias ?: '')
    def keyPassword = String.valueOf(clientTarget.signing.keyPassword ?: '')
    if (!store || !storePassword || !keyAlias || !keyPassword) {
        problems << '正式包需要 ANDROID_KEYSTORE_PATH、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD'
    } else if (!rootProject.file(store).isFile()) {
        problems << "找不到签名文件：${store}"
    }
    if (!problems.isEmpty()) {
        throw new GradleException(problems.join('\n'))
    }
}
