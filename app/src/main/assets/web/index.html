<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>CalMobile · 展会排期助手</title>
    <script>
        // 在样式表生效前先落到上次选择的明暗模式，避免首帧闪白。
        try {
            var mode = localStorage.getItem('calmobile.mode');
            if (mode === 'dark' || mode === 'light') {
                document.documentElement.dataset.mode = mode;
            }
        } catch (ignored) {
            // 隐私模式下忽略存储读取失败，保持跟随系统
        }
    </script>
    <link rel="stylesheet" href="vendor/easymde/easymde.min.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/motion.css" />
</head>

<body>
    <div id="app" class="app"></div>
    <div id="toast-host" class="toast-host" role="status" aria-live="polite"></div>
    <div id="overlay-host"></div>
    <!-- 内置二维码库：生成报名码与识别核销码，均为本地文件，不依赖 CDN -->
    <script src="vendor/qrcode-generator/qrcode.js"></script>
    <script src="vendor/jsqr/jsQR.js"></script>
    <script type="module" src="js/app.js"></script>
</body>

</html>
